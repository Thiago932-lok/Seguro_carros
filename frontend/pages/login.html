<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Entrar — Seguradora</title>
  <link rel="stylesheet" href="/css/global.css" />
  <link rel="stylesheet" href="/css/forms.css" />
</head>
<body>
  <section class="auth-page">
    <article class="auth-card">
      <h1>Entrar</h1>
      <p class="subtitle">Acesse sua área do associado</p>
      <p id="alert" class="alert alert-error hidden"></p>
      <form id="login-form">
        <p class="form-group">
          <label for="email">E-mail</label>
          <input type="email" id="email" required />
        </p>
        <p class="form-group">
          <label for="password">Senha</label>
          <input type="password" id="password" required minlength="6" />
        </p>
        <p class="form-actions">
          <button type="submit" class="btn btn-primary">Entrar</button>
        </p>
      </form>
      <p class="form-footer">Não tem conta? <a href="/pages/cadastro.html">Cadastre-se</a></p>
      <p class="form-footer"><a href="/">Voltar ao início</a></p>
    </article>
  </section>
  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
</body>
</html>
