<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cadastro — Seguradora</title>
  <link rel="stylesheet" href="/css/global.css" />
  <link rel="stylesheet" href="/css/forms.css" />
</head>
<body>
  <section class="auth-page">
    <article class="auth-card" style="max-width:520px">
      <h1>Associar-se</h1>
      <p class="subtitle">Crie sua conta de associado</p>
      <p id="alert" class="alert alert-error hidden"></p>
      <form id="register-form">
        <p class="form-group">
          <label for="name">Nome completo</label>
          <input type="text" id="name" required />
        </p>
        <p class="form-row form-group">
          <span>
            <label for="cpf">CPF</label>
            <input type="text" id="cpf" required />
          </span>
          <span>
            <label for="phone">Telefone</label>
            <input type="tel" id="phone" />
          </span>
        </p>
        <p class="form-group">
          <label for="email">E-mail</label>
          <input type="email" id="email" required />
        </p>
        <p class="form-group">
          <label for="password">Senha</label>
          <input type="password" id="password" required minlength="6" />
        </p>
        <p class="form-group">
          <label for="region">Estado (UF)</label>
          <select id="region" data-auto-region></select>
        </p>
        <p class="form-actions">
          <button type="submit" class="btn btn-primary">Criar conta</button>
        </p>
      </form>
      <p class="form-footer">Já tem conta? <a href="/pages/login.html">Entrar</a></p>
    </article>
  </section>
  <script src="/js/api.js"></script>
  <script src="/js/cpf.js"></script>
  <script src="/js/regions.js"></script>
  <script src="/js/auth.js"></script>
</body>
</html>
