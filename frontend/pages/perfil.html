<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Perfil — Seguradora</title>
  <link rel="stylesheet" href="/css/global.css" />
  <link rel="stylesheet" href="/css/dashboard.css" />
  <link rel="stylesheet" href="/css/forms.css" />
</head>
<body>
  <header class="header">
    <section class="container header-inner">
      <a href="/pages/dashboard.html" class="logo">Seguradora</a>
      <button id="btn-logout" class="btn btn-outline">Sair</button>
    </section>
  </header>
  <section class="app-layout">
    <nav class="sidebar" id="sidebar-nav"></nav>
    <main class="main-content">
      <h1 class="page-title">Meu Perfil</h1>
      <p id="alert" class="alert alert-error hidden"></p>
      <article class="card">
        <form id="profile-form">
          <p class="form-group">
            <label for="name">Nome</label>
            <input id="name" required />
          </p>
          <p class="form-group">
            <label for="email">E-mail</label>
            <input id="email" disabled />
          </p>
          <p class="form-group">
            <label for="cpf">CPF</label>
            <input id="cpf" disabled />
          </p>
          <p class="form-group">
            <label for="phone">Telefone</label>
            <input id="phone" />
          </p>
          <p class="form-group">
            <label for="region">UF</label>
            <select id="region">
              <option value="SP">SP</option><option value="RJ">RJ</option>
              <option value="MG">MG</option><option value="PR">PR</option>
              <option value="RS">RS</option><option value="BA">BA</option>
            </select>
          </p>
          <button type="submit" class="btn btn-primary">Salvar</button>
        </form>
      </article>
    </main>
  </section>
  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script>
    requireAuth();
    renderSidebar('/pages/perfil.html');
    document.getElementById('btn-logout')?.addEventListener('click', logout);

    api('/users/me').then((u) => {
      document.getElementById('name').value = u.name;
      document.getElementById('email').value = u.email;
      document.getElementById('cpf').value = u.cpf;
      document.getElementById('phone').value = u.phone || '';
      document.getElementById('region').value = u.region || 'SP';
    });

    document.getElementById('profile-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const alert = document.getElementById('alert');
      try {
        const u = await api('/users/me', {
          method: 'PUT',
          body: JSON.stringify({
            name: document.getElementById('name').value,
            phone: document.getElementById('phone').value,
            region: document.getElementById('region').value,
          }),
        });
        setUser(u);
        showAlert(alert, 'Perfil atualizado!', 'success');
      } catch (err) {
        showAlert(alert, err.message);
      }
    });
  </script>
</body>
</html>
