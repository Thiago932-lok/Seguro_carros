<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Painel — Seguradora</title>
  <link rel="stylesheet" href="/css/global.css" />
  <link rel="stylesheet" href="/css/dashboard.css" />
</head>
<body>
  <header class="header">
    <section class="container header-inner">
      <a href="/pages/dashboard.html" class="logo">Seguradora</a>
      <span>Olá, <strong id="user-name">Associado</strong> | <button id="btn-logout" class="btn btn-outline">Sair</button></span>
    </section>
  </header>
  <section class="app-layout">
    <nav class="sidebar" id="sidebar-nav"></nav>
    <main class="main-content">
      <h1 class="page-title">Painel do Associado</h1>
      <section class="stats-grid">
        <article class="stat-card"><span class="label">Veículos</span><p class="value" id="stat-cars">0</p></article>
        <article class="stat-card"><span class="label">Proteção</span><p class="value" id="stat-insurance">—</p></article>
        <article class="stat-card"><span class="label">Mensalidade</span><p class="value" id="stat-premium">—</p></article>
        <article class="stat-card"><span class="label">Valor coberto</span><p class="value" id="stat-covered">—</p></article>
        <article class="stat-card"><span class="label">Parcelas pendentes</span><p class="value" id="stat-pending">0</p></article>
      </section>
      <article class="card">
        <h2>Próximo pagamento</h2>
        <p id="next-payment">Carregando...</p>
      </article>
      <article class="card">
        <h2>Comece aqui</h2>
        <p>1. Cadastre seu carro → 2. Faça a cotação → 3. Contrate a proteção</p>
        <p style="margin-top:1rem">
          <a href="/pages/meu-carro.html" class="btn btn-primary">Cadastrar veículo</a>
          <a href="/pages/cotacao.html" class="btn btn-outline" style="margin-left:0.5rem">Simular mensalidade</a>
        </p>
      </article>
    </main>
  </section>
  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/dashboard.js"></script>
</body>
</html>
