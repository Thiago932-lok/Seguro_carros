<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cotação — MobiSeguros</title>
  <link rel="stylesheet" href="/css/global.css" />
  <link rel="stylesheet" href="/css/dashboard.css" />
  <link rel="stylesheet" href="/css/forms.css" />
  <link rel="stylesheet" href="/css/components.css" />
</head>
<body>
  <header class="header">
    <section class="container header-inner">
      <a href="/pages/dashboard.html" class="logo">Mobi<span style="color:var(--green-light)">Seguros</span></a>
      <button id="btn-logout" class="btn btn-outline">Sair</button>
    </section>
  </header>
  <section class="app-layout">
    <nav class="sidebar" id="sidebar-nav"></nav>
    <main class="main-content">
      <header class="page-header">
        <h1 class="page-title">Simulação de Mensalidade</h1>
        <p class="page-subtitle">Calcule o valor da sua proteção veicular com base na FIPE.</p>
      </header>
      <p id="alert" class="alert alert-error hidden"></p>

      <article class="card card-elevated">
        <h2 class="section-title"><span class="step-badge">1</span> Escolha o veículo</h2>
        <p class="form-group">
          <label for="car-select">Veículo cadastrado</label>
          <select id="car-select"></select>
        </p>
        <p class="form-actions" style="margin-top:0.5rem">
          <button type="button" id="btn-simulate" class="btn btn-primary">Calcular mensalidade</button>
        </p>
        <input type="hidden" id="last-quote-id" />
      </article>

      <section id="quote-result" class="quote-result hidden">
        <p style="opacity:0.9;font-size:1rem">Sua mensalidade estimada</p>
        <p class="price" id="monthly-price">R$ 0,00</p>
        <section class="quote-details">
          <article><small>Valor FIPE</small><br><strong id="fipe-display">—</strong></article>
          <article><small>Cobertura</small><br><strong id="covered-value">—</strong></article>
          <article><small>Franquia</small><br><strong id="franchise-value">—</strong></article>
        </section>
        <section class="card" style="margin-top:1.25rem;text-align:left;background:rgba(255,255,255,0.12);border:none;color:#fff">
          <h2 style="margin-bottom:0.75rem;color:#fff;font-size:1rem">Resumo do cálculo</h2>
          <section id="quote-breakdown" style="opacity:0.9">—</section>
        </section>
        <p style="margin-top:1.5rem">
          <button type="button" id="btn-contract" class="btn btn-outline" style="border-color:#fff;color:#fff">Contratar proteção</button>
        </p>
      </section>
    </main>
  </section>
  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/car.js"></script>
  <script src="/js/quote.js"></script>
  <script>renderSidebar('/pages/cotacao.html');</script>
</body>
</html>
